<text x="1170" y="527" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#a16716">先找 1 脚，再数孔</text>
<text x="1170" y="566" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">每排：左奇数 / 右偶数</text>
<text x="1170" y="594" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">第 r 行：2r−1 / 2r</text>
<text x="1170" y="622" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">例如 P2-23：第12行奇数侧</text>
<text x="1170" y="650" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">不要用 USB 朝向猜正反面</text>
<text x="1170" y="678" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">先按丝印、方焊盘定位 1 脚</text>
<text x="1170" y="706" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">不确定就通断量到已知网络</text>
<text x="65" y="985" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">板载 Flash：PA4=CS，PA5=SCK，PA6=MISO，PA7=MOSI，内部已连；不要再加外接飞线。</text>
<text x="65" y="1016" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">PA13/PA14 留 SWD，PA11/PA12 留 USB；PA0 按键、PB2 LED/BOOT1、TF/时钟资源保持保留。</text>
<text x="65" y="1047" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">VREF_EXT / BAT_EXT / AGND 不作为普通 3V3、GND 或 IO 使用；其余未用孔保持不接。</text></svg>