<text x="85" y="657" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#176da6">C1=470µF/25V；C2=100nF/104</text>
<text x="85" y="696" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">C1正脚、C2任一脚 → 保险后12V+。</text>
<text x="85" y="724" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">C1负脚、C2另一脚 → 入口负极。</text>
<text x="85" y="752" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">C1有极性，C2无极性；不接OUT−。</text>
<text x="700" y="647" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#176da6">PWM ← P2-23 / PB6</text>
<text x="700" y="686" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#536477">GND ← MCU GND</text>
<text x="65" y="838" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#172d46">电源回路：适配器+ → 保险 → DC+；适配器− → DC−；OUT± → 锁的两根线。</text>
<text x="65" y="880" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#172d46">信号回路：PB6 → PWM，MCU GND → 模块信号GND。确认高有效后再接10k下拉。</text>
<text x="65" y="922" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#172d46">入口负极另引支路到MCU GND，锁功率回流不经过MCU地线；分压板两地关系见第10页。</text>
<text x="65" y="964" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#172d46">有环端是二极管阴极K，不是电解的负极标识；两种条纹含义不同，详见第12页。</text>
<text x="65" y="1006" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#172d46">保险管额定、锁脉宽与二极管电流能力仍需实测与器件规格核对。</text></svg>