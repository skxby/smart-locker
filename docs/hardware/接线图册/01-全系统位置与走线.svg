<text x="1075" y="456" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">锁：22AWG 铜软线 + 螺丝端子</text>
<text x="1075" y="484" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">信号：20cm 母对母杜邦线</text>
<text x="1075" y="512" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">无排针器件：焊接后套热缩管</text>
<text x="1075" y="540" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">板底尼龙柱架空，不能贴裸金属</text>
<text x="1075" y="568" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">线两端贴同一线号；先量后剪</text>
<rect x="1055" y="625" width="490" height="220" rx="5" fill="#eef4f8" stroke="#eef4f8"/>
<rect x="1055" y="625" width="5" height="220" rx="5" fill="#c34b35" stroke="#c34b35"/>
<text x="1075" y="662" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#c34b35">电源分配</text>
<text x="1075" y="701" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">12V/2A → 保险 → MOS → 锁</text>
<text x="1075" y="729" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">5V USB → F407 Type-C</text>
<text x="1075" y="757" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">RK：只用原配电源</text>
<text x="1075" y="785" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">灯：独立 USB 充电口，核总电流</text>
<text x="1075" y="813" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">外壳内只走低压成品适配器输出</text>
<text x="75" y="911" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#172d46">布线：锁电源成对并行或轻绞；SPI 短线，先以低速调试；ADC 靠 MCU、远离 MOS 和锁线。</text>
<text x="75" y="949" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#172d46">安装距离先以 5cm 分区作为起点，最终以关门、开锁、相机画面和干扰实测调整。</text>
<text x="75" y="987" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#172d46">现有 1m 锁电源线须量路由总长；若不够，报告补线成本，不拉紧、不拼杜邦线。</text>
<text x="75" y="1025" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#172d46">锁扣、微动和门铰链依赖实物尺寸；无手电钻时优先复用带孔刚性支撑，不在纸箱上承力。</text></svg>