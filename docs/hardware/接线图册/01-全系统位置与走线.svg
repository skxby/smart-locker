<text x="1075" y="241" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">B01 RC522：门外非金属刷卡面</text>
<text x="1075" y="269" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">B05 微动：工具托架下，限定行程</text>
<text x="1075" y="297" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">B20 蜂鸣器：开孔朝外，避相机</text>
