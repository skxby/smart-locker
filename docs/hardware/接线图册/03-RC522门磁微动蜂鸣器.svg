<rect x="965" y="823" width="570" height="45" rx="5" fill="#eef4f8" stroke="#eef4f8"/>
<text x="78" y="850" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#172d46">S14  MCU GND 分配点</text>
<text x="978" y="850" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#172d46">蜂鸣器模块 · GND / −</text>
<polyline points="630,847 960,847" fill="none" stroke="#536477" stroke-width="3"/>
<rect x="672" y="821" width="246" height="26" rx="5" fill="white" stroke="white"/>
<text x="678" y="836" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#536477">黑</text>
<rect x="65" y="894" width="720" height="150" rx="5" fill="#eef4f8" stroke="#eef4f8"/>
<rect x="65" y="894" width="5" height="150" rx="5" fill="#176da6" stroke="#176da6"/>
<text x="85" y="931" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#176da6">传感器输入各配一个 10k 上拉</text>
<text x="85" y="970" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">3V3 → 10k → PE0；门磁接在 PE0 与 GND 间</text>
<text x="85" y="998" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">3V3 → 10k → PE1；微动接在 PE1 与 GND 间</text>
<text x="85" y="1026" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">设计预期：磁铁靠近 / 微动按下 = LOW，仍需实测</text>
<rect x="815" y="894" width="720" height="150" rx="5" fill="#eef4f8" stroke="#eef4f8"/>
<rect x="815" y="894" width="5" height="150" rx="5" fill="#a16716" stroke="#a16716"/>
<text x="835" y="931" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#a16716">其余脚与供电</text>
<text x="835" y="970" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">RC522 IRQ 不接；SDA 在 SPI 模式是 CS，不是 I²C</text>
<text x="835" y="998" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">蜂鸣器是带驱动模块，不把裸蜂鸣器接 GPIO</text>
<text x="835" y="1026" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#172d46">3V3 / GND 用焊接分配点；不能多根线硬塞杜邦孔</text></svg>